<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>MSA:DISP</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

<body>
    <main class="container mt-3 text-center">
        <div class="card" style="width: 30%;">
            <div class="card-body">
                <h1 class="text-center fw-bold">MSA:DISP</h1>
                <h3 class="text-center">Ventana de acceso</h3>
                <form action="base.html" method="POST">
                    <div class="form-floating mb-3 mt-3">
                        <input type="text" class="form-control" placeholder="N&uacute;mero de personal" id="u" name="u"
                            required>
                        <label for="floatingInput">N&uacute;mero de personal</label>
                    </div>
                    <div class="form-floating mb-3 mt-3">
                        <input type="password" class="form-control" placeholder="Credencial" name="p" required>
                        <label for="floatingPassword">Credencial</label>
                    </div>
                    <button type="submit" class="btn btn-dark text-info fw-bold">Acceder</button>
                </form>
                <div class="mt-3 p-1 text">
                    <p>ANDE - Paraguay 🇵🇾</p>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
